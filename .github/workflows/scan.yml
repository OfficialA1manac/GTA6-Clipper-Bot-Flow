name: scan
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: worker busy?
        id: busy
        run: |
          n=$(gh run list --workflow clip.yml --json status --jq '[.[]|select(.status=="queued" or .status=="in_progress")]|length')
          echo "n=$n" >> "$GITHUB_OUTPUT"
      - if: steps.busy.outputs.n == '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.busy.outputs.n == '0'
        id: scan
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          pip install -q pyyaml yt-dlp
          echo "job=$(python clipper.py scan)" >> "$GITHUB_OUTPUT"
      - name: dispatch worker
        if: steps.busy.outputs.n == '0' && steps.scan.outputs.job != ''
        env:
          JOB: ${{ steps.scan.outputs.job }}
        run: |
          gh workflow run clip.yml -f url="$(jq -r .url <<<"$JOB")" -f channel="$(jq -r .channel <<<"$JOB")" -f title="$(jq -r .title <<<"$JOB")"
      - name: save state
        if: steps.busy.outputs.n == '0'
        run: |
          git config user.name clipper-bot; git config user.email clipper-bot@users.noreply.github.com
          git add state/seen.json state/leads.json
          if ! git diff --cached --quiet; then
            git commit -m "state: seen"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break || sleep 5; done
          fi
