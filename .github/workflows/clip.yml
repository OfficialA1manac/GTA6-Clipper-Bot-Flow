name: clip
on:
  workflow_dispatch:
    inputs:
      url: {description: "YouTube URL", required: false, default: ""}
      channel: {description: "Source name", required: false, default: ""}
      title: {description: "Video title", required: false, default: ""}
      inbox: {description: "Process inbox/ instead (true/false)", required: false, default: "false"}
permissions:
  contents: write
concurrency:
  group: clip
  cancel-in-progress: false
jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: clip and post
        env:
          IN_URL: ${{ inputs.url }}
          IN_CHANNEL: ${{ inputs.channel }}
          IN_TITLE: ${{ inputs.title }}
          IN_INBOX: ${{ inputs.inbox }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: |
          if [ "$IN_INBOX" = "true" ]; then python clipper.py run --inbox
          else python clipper.py run --url "$IN_URL" --channel "$IN_CHANNEL" --title "$IN_TITLE"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips
          path: out/queue
          if-no-files-found: ignore
      - name: save state
        if: always()
        run: |
          git config user.name clipper-bot; git config user.email clipper-bot@users.noreply.github.com
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "state: posted"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break || sleep 5; done
          fi
