settings:
  clip_seconds: 65         # every clip is at least 1:00 (minimum enforced in code)
  clips_per_video: 2        # best moments per source video
  max_age_hours: 72         # ignore older uploads
  max_source_minutes: 90    # videos longer than this are treated as streams: audio is scanned, only the best moments are downloaded
  max_clips_per_stream: 6   # best moments taken from one long stream/VOD
  max_posts_per_day: 15     # total clips posted per 24h
  max_youtube_per_day: 6    # default YouTube API quota fits ~6 uploads/day (more needs a Google quota increase)
  max_tiktok_per_day: 15    # TikTok Content Posting API cap per account
  # Titles containing these are skipped. Endings, cutscenes, cheats and mods are allowed per your call
  # (Rockstar's policy lets it remove them; risk is on the account). Leaks stay blocked: unreleased/stolen footage.
  skip_title_words: [leak, leaked, pre-release, prerelease]
  upload_youtube: true

# ONLY add sources you have permission to clip. The pipeline skips any entry without `permission`.
# Valid permission = an active Content Rewards/Vyro campaign that covers that creator, written OK from the creator, or your own channel.
sources: []
# - name: ExampleStreamer
#   channel_id: UCxxxxxxxxxxxxxxxxxxxxxx
#   permission: "Content Rewards campaign <link> allows GTA 6 clipping"
